# --- Unifying RF via Nordic ESB (nRF Connect SDK) ---
CONFIG_ESB=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=32
CONFIG_BT=n

# Adafruit UF2 bootloader boards: emit UF2 and keep SoftDevice gap
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_BUILD_OUTPUT_HEX=y

# --- Heap for unifying ring buffers / payloads (malloc) ---
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_COMMON_LIBC_MALLOC=y

# --- Timing / entropy ---
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- GPIO LED ---
CONFIG_GPIO=y

# --- Flash / NVS for pairing credentials ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# --- USB CDC ACM console (legacy stack; matches NCS 2.9 Codespaces image) ---
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_PRODUCT="ProMicro Unifying"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x520F

# Ring buffer for UART RX line assembly
CONFIG_RING_BUFFER=y

# Main stack for pair/connect loops
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
